[port]
name = "telegramd"
version = "1.0"
description = "A LaunchDaemon that relaunches Telegram into the background when its process is gone"

[platform]
use = "apple-ios"
arch = "armv7"
os-version = "6.0"
distribution = "jailbreak"

[tools]
ldid = "2.1.5-procursus7+23.gaf86971@charon/stable"

[variants.armv7]

[[executable]]
name = "telegramd"
sources = ["src/telegramd.c"]
install = "/usr/libexec"
installs-into = "stage"
frameworks = ["CoreFoundation"]
options = ["-Os", "-Wall", "-Wextra"]
entitlements = "entitlements.plist"
resources = [
    { from = "com.kern0x1b.telegramd.plist", as = "/Library/LaunchDaemons/com.kern0x1b.telegramd.plist" },
    { from = "telegramd.conf", as = "/etc/telegramd.conf" },
]

[package]
control = "packaging/control"
maintainer-scripts = "packaging/DEBIAN"

[pipeline]
armv7 = ["build:executable", "check:imports"]
