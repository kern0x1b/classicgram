[port]
name = "telegramsystemcall"
version = "1.0"
description = "An incoming Telegram call on SpringBoard's own call alert"

[platform]
use = "apple-ios"
arch = "armv7"
os-version = "6.0"
distribution = "jailbreak"

[tools]
ldid = "2.1.5-procursus7+23.gaf86971@charon/stable"

[variants.armv7]

[[device-library]]
name = "TelegramSystemCall"
sources = ["src/TSCTweak.m"]
install = "/Library/MobileSubstrate/DynamicLibraries"
installs-into = "stage"
frameworks = ["Foundation"]
options = ["-O2", "-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-deprecated-declarations", "-fobjc-exceptions"]
resources = ["packaging/TelegramSystemCall.plist"]

[tasks.links-neither-uikit-nor-substrate]
shell = "if otool -L {stage}/Library/MobileSubstrate/DynamicLibraries/TelegramSystemCall.dylib | grep -E -q 'UIKit|substrate'; then echo 'TelegramSystemCall links UIKit or substrate, and SpringBoard loads it before either is safe to bind'; exit 1; fi"

[package]
control = "packaging/control"
maintainer-scripts = "packaging/DEBIAN"

[pipeline]
armv7 = ["build:device-library", "task:links-neither-uikit-nor-substrate", "check:imports"]
